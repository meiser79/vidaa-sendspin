services:
  vidaa-sendspin:
    build: .
    container_name: vidaa-sendspin
    # Host networking is required for mDNS discovery of the Music Assistant
    # Sendspin server (multicast does not cross Docker's bridge network).
    network_mode: host
    environment:
      - TZ=Europe/Berlin
      - PORT=8080
    restart: unless-stopped
