<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Sendspin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-maskable.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05080f">
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Inter is bundled (copied from @fontsource/inter at build time) because
       the TV may have no internet access. */
    @font-face { font-family:'Inter'; font-weight:400; font-display:block; src:url(fonts/inter-latin-400-normal.woff2) format('woff2'),url(fonts/inter-latin-400-normal.woff) format('woff'); }
    @font-face { font-family:'Inter'; font-weight:600; font-display:block; src:url(fonts/inter-latin-600-normal.woff2) format('woff2'),url(fonts/inter-latin-600-normal.woff) format('woff'); }
    @font-face { font-family:'Inter'; font-weight:700; font-display:block; src:url(fonts/inter-latin-700-normal.woff2) format('woff2'),url(fonts/inter-latin-700-normal.woff) format('woff'); }

    /* Everything is sized in rem; 1rem = 16px on a 1920px wide screen, so the
       layout scales identically on 1280x720 and 1920x1080 TV browsers.
       --accent is replaced at runtime by a colour taken from the artwork. */
    :root {
      --bg:#05080f; --text:#f5f7fb; --soft:rgba(245,247,251,.72); --muted:rgba(245,247,251,.5); --dim:rgba(245,247,251,.32);
      --accent:#e6e9f0; --focus:rgba(255,255,255,.9);
      --panel:rgba(10,14,24,.96); --line:rgba(255,255,255,.08);
      --green:#46de70; --yellow:#e8bd58; --red:#ff5c68;
      font-size:calc(100vw / 120);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; color:inherit; }
    button { border:0; background:transparent; cursor:pointer; padding:0; }
    button:focus,input:focus,[tabindex]:focus { outline:.2rem solid var(--focus); outline-offset:.25rem; }
    svg { display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

    /* Backdrop: two gradient layers in artwork colours, crossfaded on change */
    .backdrop { position:fixed; inset:0; opacity:0; transition:opacity .8s ease; }
    .backdrop.show { opacity:1; }
    .vignette { position:fixed; inset:0; background:radial-gradient(ellipse 120% 90% at 30% 50%,rgba(5,8,15,0) 0,rgba(5,8,15,.55) 100%); }

    .screen { position:relative; height:100vh; display:flex; flex-direction:column; padding:2.5rem 5rem 3rem; transition:opacity .4s ease,transform .6s ease; }

    /* Long pause: dim and slowly drift the layout against burn-in */
    /* Startup: stay dark until the first track (artwork + colours) is ready */
    body.booting .screen,body.booting .backdrop { opacity:0; transition:none; }

    body.dimmed .screen { opacity:.3; transition:opacity 4s ease,transform 12s ease-in-out; }
    body.dimmed .backdrop.show { opacity:.35; transition:opacity 4s ease; }

    /* Controls fade out after a few idle seconds (body.idle) */
    .fade { transition:opacity .35s ease,transform .35s ease; }
    body.idle .fade { opacity:0; transform:translateY(.6rem); visibility:hidden; transition:opacity .8s ease,transform .8s ease,visibility 0s linear .8s; }

    /* Top bar: clock, plus the settings gear while controls are visible */
    .topbar { display:flex; align-items:center; justify-content:flex-end; gap:1.25rem; height:3.5rem; }
    .clock { font-size:1.6rem; color:var(--soft); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
    .icon-btn { width:3.5rem; height:3.5rem; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--soft); }
    .icon-btn svg { width:1.8rem; height:1.8rem; }
    .icon-btn:focus { color:var(--text); background:rgba(255,255,255,.12); outline:0; }

    /* Now playing: large artwork, text aligned to its bottom edge */
    .now { flex:1; min-height:0; display:flex; align-items:center; }
    .hero { display:flex; align-items:flex-end; gap:4.5rem; width:100%; min-width:0; }
    .art { flex:0 0 auto; width:60vh; height:60vh; border-radius:2rem; background:rgba(255,255,255,.05) center/cover no-repeat; box-shadow:0 2rem 5rem rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06); position:relative; }
    /* Placeholder without artwork: an outlined record */
    .art-layer { position:absolute; inset:0; border-radius:inherit; background:center/cover no-repeat; opacity:0; transition:opacity .8s ease; }
    .art-layer.show { opacity:1; }
    .art:not(.has-art)::after { content:''; position:absolute; left:50%; top:50%; width:10rem; height:10rem; margin:-5rem 0 0 -5rem; border:.2rem solid var(--dim); border-radius:50%; background:radial-gradient(circle,transparent 0 1.2rem,var(--dim) 1.25rem 1.45rem,transparent 1.5rem); }
    .meta { flex:1; min-width:0; padding-bottom:.4rem; }
    .title { font-size:4.75rem; font-weight:700; line-height:1.15; padding-bottom:.08em; letter-spacing:-.025em; margin-bottom:.9rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .artist { font-size:2.25rem; color:var(--soft); margin-bottom:1.5rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* New track: title, artist and album rise in one after another */
    @keyframes rise { from { opacity:0; transform:translateY(1.2rem); } to { opacity:1; transform:none; } }
    .rise { animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
    #trackArtist.rise { animation-delay:.08s; }
    #trackAlbum.rise { animation-delay:.16s; }
    .album { font-size:1.05rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.3rem; }

    /* Transport */
    .transport { display:flex; flex-direction:column; gap:1rem; }
    .seek { padding:.6rem 0; margin:-.6rem 0; border-radius:.4rem; }
    .seek:focus { outline-offset:.15rem; }
    .progress { height:.3rem; border-radius:.15rem; background:rgba(255,255,255,.14); overflow:hidden; }
    .progress-fill { height:100%; width:0; background:var(--accent); }
    .seek:focus .progress { height:.6rem; margin:-.15rem 0; border-radius:.3rem; }
    .seek.previewing .progress-fill { background:var(--text); }
    .times { display:flex; justify-content:space-between; font-size:1.05rem; color:var(--muted); font-variant-numeric:tabular-nums; }
    .times .previewing { color:var(--text); font-weight:600; }
    .controls { display:flex; align-items:center; justify-content:center; gap:2.25rem; position:relative; margin-top:.5rem; }
    .ctl { width:4.25rem; height:4.25rem; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--soft); transition:background .15s,color .15s; }
    .ctl svg { width:2rem; height:2rem; }
    .ctl:focus { outline:0; background:rgba(255,255,255,.14); color:var(--text); }
    .ctl.toggle { color:var(--dim); position:relative; }
    .ctl.toggle.on { color:var(--accent); }
    .ctl.toggle.on::after { content:''; position:absolute; bottom:.3rem; left:50%; width:.3rem; height:.3rem; margin-left:-.15rem; border-radius:50%; background:var(--accent); }
    .ctl .one { position:absolute; font-size:.7rem; font-weight:700; top:1.6rem; display:none; }
    .ctl.repeat-one .one { display:block; }
    .ctl.primary { width:5.5rem; height:5.5rem; color:var(--text); box-shadow:inset 0 0 0 .15rem var(--accent); }
    .ctl.primary svg { width:2.4rem; height:2.4rem; stroke-width:1.6; }
    .ctl.primary:focus { background:rgba(255,255,255,.14); }
    .volume { position:absolute; right:0; display:flex; align-items:center; gap:.9rem; font-size:1.05rem; color:var(--muted); }
    .volume input { width:11rem; accent-color:var(--accent); }
    .volume .ctl { width:3.25rem; height:3.25rem; }
    .volume .ctl svg { width:1.6rem; height:1.6rem; }
    .volume input.adjusting { outline-color:var(--accent); outline-width:.3rem; }
    .volume:has(.adjusting) .vol-value { color:var(--text); font-weight:600; }
    .vol-value { width:3.5rem; text-align:right; font-variant-numeric:tabular-nums; }

    /* Notice shown while no server is known */
    .notice { position:absolute; left:50%; top:3rem; transform:translateX(-50%); padding:.75rem 1.4rem; border-radius:2rem; background:var(--panel); border:1px solid var(--line); font-size:1.1rem; color:var(--soft); display:none; white-space:nowrap; }
    .notice.show { display:block; }

    /* Settings drawer */
    .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; }
    .drawer { position:fixed; top:0; right:0; bottom:0; width:46rem; max-width:100%; background:var(--panel); border-left:1px solid var(--line); padding:2.5rem 2.5rem 0; display:none; flex-direction:column; }
    body.settings-open .scrim { display:block; }
    body.settings-open .drawer { display:flex; }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.75rem; }
    .drawer-head h1 { margin:0; font-size:2.2rem; font-weight:700; letter-spacing:-.02em; }
    .drawer-body { flex:1; overflow-y:auto; padding-bottom:3rem; }
    .section { border:1px solid var(--line); border-radius:1rem; background:rgba(255,255,255,.03); padding:1.4rem 1.5rem; margin-bottom:1.25rem; }
    .label { color:var(--accent); font-size:.85rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin-bottom:.75rem; }
    .hint { color:var(--soft); font-size:1.05rem; line-height:1.5; margin-bottom:1rem; }
    .value { font-size:1.15rem; line-height:1.4; margin-bottom:1rem; overflow-wrap:break-word; }
    .pin { font-size:4rem; font-weight:700; letter-spacing:.12em; margin:.25rem 0 1rem; font-variant-numeric:tabular-nums; }
    .pin.empty { font-size:2rem; font-weight:400; color:var(--dim); letter-spacing:0; }
    .actions { display:flex; gap:.75rem; flex-wrap:wrap; }
    .btn { border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04); border-radius:.6rem; padding:.8rem 1.2rem; font-size:1.1rem; }
    .btn.primary { border-color:var(--accent); color:var(--text); }
    .kv { display:flex; justify-content:space-between; align-items:center; gap:1rem; font-size:1.05rem; padding:.5rem 0; border-top:1px solid var(--line); }
    .kv:first-of-type { border-top:0; }
    .kv > span:first-child { color:var(--muted); }
    .kv > span:last-child { text-align:right; word-break:break-all; }
    .kv .mono { font-family:monospace; font-size:.95rem; color:var(--soft); white-space:nowrap; }
    .status { display:flex; align-items:center; gap:.6rem; }
    .dot { width:.7rem; height:.7rem; border-radius:50%; background:var(--dim); }
    .dot.ok { background:var(--green); } .dot.warn { background:var(--yellow); } .dot.bad { background:var(--red); }
    #debugLog { height:16rem; overflow:auto; margin:0; background:rgba(0,0,0,.4); border-radius:.6rem; padding:.9rem; font:.85rem/1.4 monospace; white-space:pre-wrap; color:var(--soft); }
  </style>
</head>
<body class="booting">
<div id="backdropA" class="backdrop"></div>
<div id="backdropB" class="backdrop"></div>
<div class="vignette"></div>

<div class="screen">
  <header class="topbar">
    <div id="clock" class="clock">--:--</div>
    <button id="openSettings" class="icon-btn fade" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="notice" class="notice"></div>

  <main class="now">
    <div class="hero">
      <div id="albumArt" class="art"><div class="art-layer"></div><div class="art-layer"></div></div>
      <div class="meta">
        <div id="trackTitle" class="title">Nothing playing</div>
        <div id="trackArtist" class="artist"></div>
        <div id="trackAlbum" class="album"></div>
      </div>
    </div>
  </main>

  <footer class="transport">
    <div id="seekBar" class="seek" tabindex="0" aria-label="Track position"><div class="progress"><div id="progressFill" class="progress-fill"></div></div></div>
    <div class="times fade"><span id="timeElapsed">0:00</span><span id="timeTotal"></span></div>
    <div class="controls fade">
      <button id="shuffle" class="ctl toggle" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button id="previous" class="ctl" title="Previous" aria-label="Previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6.5 9 12l9 5.5z"/></svg>
      </button>
      <button id="playPause" class="ctl primary" title="Play/Pause" aria-label="Play/Pause">
        <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5 18.5 12l-10 6.5z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M8 5.5v13M16 5.5v13"/></svg>
      </button>
      <button id="next" class="ctl" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6.5l9 5.5-9 5.5z"/></svg>
      </button>
      <button id="repeat" class="ctl toggle" title="Repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        <span class="one">1</span>
      </button>

      <div class="volume">
        <button id="muteBtn" class="ctl" title="Mute" aria-label="Mute">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="volWaves" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path id="volMuted" d="m16 10 4 4m0-4-4 4" style="display:none"/></svg>
        </button>
        <input id="volumeSlider" type="range" min="0" max="100" value="100" aria-label="Volume">
        <span id="volumeValue" class="vol-value">100%</span>
      </div>
    </div>
  </footer>
</div>

<div class="scrim"></div>
<aside id="settings" class="drawer" aria-label="Settings">
  <div class="drawer-head">
    <h1>Settings</h1>
    <button id="closeSettings" class="icon-btn" title="Close" aria-label="Close settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div id="settingsBody" class="drawer-body">
    <section class="section">
      <div class="label">Pairing</div>
      <div class="hint">Start pairing in Music Assistant, then enter the PIN shown here. If Music Assistant asks for confirmation on the device, press <b>Allow pairing</b>.</div>
      <div id="pairStatus" class="value">Not paired yet</div>
      <div id="pairPin" class="pin empty">No PIN requested</div>
      <div class="actions">
        <button id="openPairing" class="btn primary">Allow pairing</button>
        <button id="cancelPairing" class="btn">Cancel</button>
      </div>
    </section>

    <section class="section">
      <div class="label">Connection</div>
      <div class="kv"><span>Status</span><span class="status"><span id="connectionDot" class="dot"></span><span id="connectionText">Searching…</span></span></div>
      <div class="kv"><span>Server</span><span id="serverName">—</span></div>
      <div class="kv"><span>Address</span><span id="serverUrl">—</span></div>
      <div class="kv"><span>Sync</span><span id="syncInfo">—</span></div>
      <div class="kv"><span>Client ID</span><span id="clientId" class="mono">—</span></div>
      <div class="actions" style="margin-top:1rem"><button id="reconnectBtn" class="btn">Search again</button></div>
    </section>

    <section class="section">
      <div class="label">Debug log</div>
      <pre id="debugLog" tabindex="0"></pre>
    </section>
  </div>
</aside>

<script src="sendspin.js"></script>
</body>
</html>
